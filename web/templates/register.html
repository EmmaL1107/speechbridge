{% extends "base.html" %}
{% block title %}{{ t("auth.register", lang) }} — SpeechBridge{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="card auth-card">
        <h2>{{ t("auth.register", lang) }}</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register">
            <div class="form-group">
                <label>{{ t("auth.username", lang) }}</label>
                <input type="text" name="username" required autofocus placeholder="{{ t('auth.username', lang) }}">
            </div>
            <div class="form-group">
                <label>{{ t("auth.email", lang) }}</label>
                <input type="email" name="email" required placeholder="{{ t('auth.email', lang) }}">
            </div>
            <div class="form-group">
                <label>{{ t("auth.password", lang) }}</label>
                <input type="password" name="password" required minlength="6" placeholder="{{ t('auth.password', lang) }}">
            </div>
            <div class="form-group">
                <label>{{ t("auth.confirm_password", lang) }}</label>
                <input type="password" name="confirm_password" required placeholder="{{ t('auth.confirm_password', lang) }}">
            </div>
            <button type="submit" class="btn btn-primary btn-block">{{ t("auth.register_btn", lang) }}</button>
        </form>

        <p class="auth-link">{{ t("auth.has_account", lang) }} <a href="/login">{{ t("auth.login", lang) }}</a></p>
    </div>
</div>
{% endblock %}
