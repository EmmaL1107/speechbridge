[project]
name = "speechbridge"
version = "0.1.0"
description = "智能语义恢复系统 — 理解用户想表达什么，而不仅仅是识别说了什么"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SpeechBridge Team"}
]

dependencies = [
    "faster-whisper>=1.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "pydub>=0.25.1",
    "soundfile>=0.12.0",
    "noisereduce>=3.0.0",
    "litellm>=1.50.0",
    "edge-tts>=6.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "dashscope>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.6.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.40.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
speechbridge = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
